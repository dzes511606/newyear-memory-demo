<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新春翻牌賀歲｜築間 × 明星三缺一（示範版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#D93A22; --bg2:#A9170F; --pattern:rgba(255,214,120,.16); --glow:rgba(255,206,110,.45);
  --felt:#1E5E46; --felt-deep:#164A37; --paper:#B8231F; --paper-deep:#8E1915;
  --gold:#D4AF5A; --gold-soft:#EBD49A; --ivory:#F6EEDB; --ivory-edge:#DCCFAE;
  --ink:#2A1A14; --text:#FFF6E2; --muted:#FBDDB8; --panel:#F6EEDB; --panel-text:#2A1A14;
  --panel-muted:#6B5A4C; --line:rgba(42,26,20,.15); --ok:#1E5E46; --warn:#B8231F;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#8E1C12; --bg2:#5C0E09; --pattern:rgba(255,214,120,.10); --glow:rgba(255,190,90,.25);
    --felt:#123D2E; --felt-deep:#0C2C21; --panel:#2A231C; --panel-text:#F3E9D2;
    --panel-muted:#BFAE96; --line:rgba(243,233,210,.15); --ivory:#EFE5CC; --ok:#5FB38C; --warn:#F07A6E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#8E1C12; --bg2:#5C0E09; --pattern:rgba(255,214,120,.10); --glow:rgba(255,190,90,.25);
  --felt:#123D2E; --felt-deep:#0C2C21; --panel:#2A231C; --panel-text:#F3E9D2;
  --panel-muted:#BFAE96; --line:rgba(243,233,210,.15); --ivory:#EFE5CC; --ok:#5FB38C; --warn:#F07A6E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background-color:var(--bg2);
  background-image:
    radial-gradient(ellipse 90% 45% at 50% 0%,var(--glow),transparent 70%),
    radial-gradient(circle,transparent 0 22%,var(--pattern) 23% 31%,transparent 32%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  background-size:auto,48px 48px,auto;
  background-attachment:fixed;
}
body.custom-bg{background-size:cover;background-position:center top;background-repeat:no-repeat;background-attachment:scroll}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.serif{font-family:"Noto Serif TC","Songti TC",serif}

/* masthead: the red spring-couplet banner */
.banner{
  background:var(--paper-deep);color:var(--gold-soft);border:4px double var(--gold);
  border-radius:6px;padding:14px 16px 16px;text-align:center;position:relative;
  box-shadow:0 6px 0 rgba(60,6,4,.45),0 0 0 6px rgba(212,175,90,.25);
}
.brands{display:flex;align-items:center;justify-content:center;gap:10px;font-size:.85rem;color:var(--gold-soft);min-height:28px}
.brands img{height:28px;max-width:110px;object-fit:contain}
.brands .x{opacity:.8}
.banner h1{margin:6px 0 0;font-family:"Noto Serif TC",serif;font-weight:900;font-size:2rem;letter-spacing:.12em;color:var(--gold)}

.screen{display:none;margin-top:20px}
.screen.on{display:block}

.card{background:var(--panel);color:var(--panel-text);border-radius:10px;padding:18px}
.card h2{margin:0 0 6px;font-family:"Noto Serif TC",serif;font-size:1.25rem}
.card p{margin:0 0 12px;line-height:1.7;color:var(--panel-muted)}
.card p strong{color:var(--panel-text)}
label.f{display:block;font-weight:700;margin:10px 0 6px}
input[type=text],input[type=number],textarea{
  width:100%;font:inherit;font-size:1rem;padding:12px;border-radius:8px;
  border:1.5px solid var(--line);background:transparent;color:var(--panel-text)
}
input:focus-visible,textarea:focus-visible,button:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{font-size:.85rem;color:var(--warn);min-height:1.2em;margin-top:6px}
.btn{
  display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:8px;
  background:var(--paper);color:var(--gold-soft);font:inherit;font-size:1.1rem;font-weight:700;
  letter-spacing:.1em;cursor:pointer;box-shadow:0 4px 0 var(--paper-deep)
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--paper-deep)}
.btn.ghost{background:transparent;color:var(--panel-text);box-shadow:none;border:1.5px solid var(--line);letter-spacing:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* leaderboard */
.board{margin-top:16px}
.board ol{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:2em 1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.board li:first-child{border-top:0}
.board .rk{font-family:"Noto Serif TC",serif;font-weight:900;color:var(--paper);text-align:center}
.board .sc{font-variant-numeric:tabular-nums;font-weight:700}
.board .me{background:rgba(212,175,90,.18);border-radius:6px}
.board li.empty{display:block;color:var(--panel-muted);font-size:.9rem;padding:8px 0}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-variant-numeric:tabular-nums}
.hud .big{font-family:"Noto Serif TC",serif;font-size:1.6rem;font-weight:900;color:var(--gold)}
.hud small{color:var(--muted)}
.timebar{height:8px;border-radius:4px;background:rgba(0,0,0,.25);overflow:hidden;margin-bottom:14px}
.timebar i{display:block;height:100%;background:var(--gold);transform-origin:left;transition:transform .1s linear}
.timebar.low i{background:#F07A6E}

/* mahjong tiles */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;perspective:800px}
.tile{
  position:relative;aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer;
  transform-style:preserve-3d;transition:transform .35s ease;border-radius:8px
}
.tile.up,.tile.done{transform:rotateY(180deg)}
.tile .fc{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;overflow:hidden}
.tile .back{
  background:var(--felt-deep);border:3px solid var(--gold);
  box-shadow:0 4px 0 #0A241A;display:grid;place-items:center
}
.tile .back img{width:100%;height:100%;object-fit:cover}
.tile .back .seal{width:58%;aspect-ratio:1;border:2px solid var(--gold);transform:rotate(45deg);display:grid;place-items:center}
.tile .back .seal span{transform:rotate(-45deg);font-family:"Noto Serif TC",serif;font-weight:900;color:var(--gold);font-size:clamp(1rem,5vw,1.5rem)}
.tile .front{
  transform:rotateY(180deg);background:var(--ivory);border-bottom:6px solid var(--ivory-edge);
  box-shadow:0 4px 0 #B9A97F;display:grid;place-items:center;padding:8%
}
.tile .front img{width:100%;height:100%;object-fit:contain}
.tile .front svg{width:100%;height:100%}
.tile.done .front{animation:pop .4s ease}
.tile.done{cursor:default}
.tile.done .front::after{content:"";position:absolute;inset:0;background:rgba(212,175,90,.18)}
.tile.miss .front{animation:shake .35s}
@keyframes pop{50%{transform:rotateY(180deg) scale(1.08)}}
@keyframes shake{25%{translate:-4px 0}75%{translate:4px 0}}

/* result */
.result-score{font-family:"Noto Serif TC",serif;font-size:3.4rem;font-weight:900;color:var(--paper);line-height:1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.redeem{
  margin-top:16px;border:2px dashed var(--paper);border-radius:10px;padding:16px;text-align:center;position:relative;overflow:hidden
}
.redeem .prize{font-family:"Noto Serif TC",serif;font-size:1.5rem;font-weight:900;margin:4px 0}
.clock{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;margin:6px 0 2px}
.fu{
  width:84px;height:84px;margin:6px auto 4px;background:var(--paper);color:var(--gold);
  display:grid;place-items:center;transform:rotate(45deg);animation:spin 6s linear infinite;border:2px solid var(--gold)
}
.fu span{transform:rotate(-45deg);font-family:"Noto Serif TC",serif;font-weight:900;font-size:2.4rem;display:block}
@keyframes spin{to{transform:rotate(405deg)}}
.code{margin-top:12px;padding:12px;background:rgba(212,175,90,.2);border-radius:8px}
.code b{display:block;font-size:1.3rem;letter-spacing:.08em;word-break:break-all;margin:4px 0}
.code button{font:inherit;padding:6px 14px;border-radius:6px;border:1.5px solid var(--line);background:transparent;color:var(--panel-text);cursor:pointer}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;inset:0;background:rgba(255,255,255,.25);transform:scaleX(0);transform-origin:left}
.stamp{
  margin:14px auto 0;display:inline-block;padding:8px 16px;border:3px solid var(--warn);color:var(--warn);
  font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.3rem;transform:rotate(-6deg);border-radius:6px
}
.redeem.used .fu{animation:none;filter:grayscale(1);opacity:.5}

/* admin */
details.admin{margin-top:28px;background:var(--panel);color:var(--panel-text);border-radius:10px}
details.admin summary{padding:14px 18px;font-weight:700;cursor:pointer}
.admin .in{padding:0 18px 18px}
.admin h3{font-family:"Noto Serif TC",serif;margin:18px 0 8px;font-size:1.05rem}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:6px;display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer;font-size:.75rem;color:var(--panel-muted);text-align:center;padding:4px;background:transparent;font-family:inherit}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--ivory)}
.slot input{display:none}
.slots.wide{grid-template-columns:repeat(2,1fr)}
.slots.wide .slot{aspect-ratio:auto;min-height:72px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{border:1px solid var(--line);border-radius:8px;padding:10px 4px}
.stats b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--panel-muted)}
.note{font-size:.85rem;color:var(--panel-muted);line-height:1.6;margin:8px 0 0}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--text);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){
  .tile{transition:none}.fu{animation:none}.tile.done .front,.tile.miss .front{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="banner">
    <div class="brands" id="brands"><span>築間</span><span class="x">×</span><span>明星三缺一</span></div>
    <h1>新春翻牌賀歲</h1>
  </header>

  <!-- start -->
  <section class="screen on" id="sStart">
    <div class="card">
      <h2>翻出 8 對一樣的牌</h2>
      <p id="rules"></p>
      <label class="f" for="pid">輸入你的明星三缺一遊戲 ID</label>
      <input type="text" id="pid" maxlength="20" autocomplete="off" placeholder="例如 12345678">
      <div class="hint" id="pidHint"></div>
      <button class="btn" id="startBtn">開始翻牌</button>
    </div>
    <div class="card board" id="boardCard">
      <h2>新春積分榜</h2>
      <ol id="board"><li class="empty">還沒有人上榜，搶頭香吧</li></ol>
    </div>
  </section>

  <!-- game -->
  <section class="screen" id="sGame">
    <div class="hud">
      <div><span class="big" id="tLeft">60</span> <small>秒</small></div>
      <div><small>配對</small> <span class="big" id="pairs">0</span><small>/8</small></div>
      <div><small>分數</small> <span class="big" id="live">0</span></div>
    </div>
    <div class="timebar" id="bar"><i id="barFill"></i></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- result -->
  <section class="screen" id="sResult">
    <div class="card" id="resultCard"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

const DEFAULT_CFG = {"time": 45, "pass": 450, "prize": "築間肉品/海鮮乙份", "cap": 100, "once": true, "missDelay": 0.5, "bg": null, "faces": ["b6c53b118e79a6fbbd5dfdf338f3b8ad", "5cc76746190658d84931613a1babc7cc", "4f20e4c9729fbcbeb721e86d05ca0b3b", "d30a776dfc76f1ca8e5dee8962e78475", "894f5465e1af6ad5d8563bdbcf4ea270", "fb56c46aba41a95fb921da79f1ac4daa", "e1a5ebe51f3b4279695b22557135c601", "f13ef13ff3e927f4f2aabf0b9944a017"], "back": "cb10e9527b4da18b794cf0120ff2efc3", "logoA": "5427a2d4232d7adc11fa03688f9f16a5", "logoB": "ecfb1d6d4641d258044bbf70fc7bd5c9"};
const GLYPHS = [["發","#1E6B3E"],["中","#B8231F"],["福","#B8231F"],["春","#1E4E8C"],["財","#9A7A1E"],["東","#2A1A14"],["囍","#B8231F"],["鍋","#1E4E8C"]];
const S = { cfg:{...DEFAULT_CFG}, db:null, user:null, assets:null, canEdit:false, pid:"", holder:Math.random().toString(36).slice(2), scores:[], demo:true };
const $ = id => document.getElementById(id) || {};
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const blob = id => id ? (ASSETS[id]||null) : null;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("on"),2200); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id)); window.scrollTo(0,0); }
function mask(p){ p=String(p); return p.length<=4 ? p[0]+"***" : p.slice(0,2)+"***"+p.slice(-2); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function glyphSVG(i){
  const [ch,col]=GLYPHS[i];
  return `<svg viewBox="0 0 60 80" aria-hidden="true"><rect x="4" y="4" width="52" height="72" rx="5" fill="none" stroke="${col}" stroke-width="1.5" opacity=".35"/><text x="30" y="52" text-anchor="middle" font-family="Noto Serif TC,serif" font-weight="900" font-size="36" fill="${col}">${ch}</text></svg>`;
}
function faceHTML(i){
  const id=S.cfg.faces[i];
  return id ? `<img src="${blob(id)}" alt="">` : glyphSVG(i);
}

function renderChrome(){
  const c=S.cfg;
  $("rules").innerHTML = `限時 <strong>${c.time} 秒</strong>，配對越快、翻錯越少分數越高。達到 <strong>${c.pass} 分</strong>即可現場兌換「${esc(c.prize)}」，並領取明星三缺一虛寶序號。`;
  const a = c.logoA ? `<img src="${blob(c.logoA)}" alt="築間">` : "<span>築間</span>";
  const b = c.logoB ? `<img src="${blob(c.logoB)}" alt="明星三缺一">` : "<span>明星三缺一</span>";
  $("brands").innerHTML = a+'<span class="x">×</span>'+b;
  if(c.bg){ document.body.classList.add("custom-bg"); document.body.style.backgroundImage=`url("${blob(c.bg)}")`; }
  else { document.body.classList.remove("custom-bg"); document.body.style.removeProperty("background-image"); }
}

/* ---------- leaderboard ---------- */
function renderBoard(){
  const best=new Map();
  for(const s of S.scores){ const cur=best.get(s.pid); if(!cur || s.score>cur.score) best.set(s.pid,s); }
  const top=[...best.values()].sort((a,b)=>b.score-a.score||a.t-b.t).slice(0,10);
  const ol=$("board");
  if(!top.length){ ol.innerHTML='<li class="empty">還沒有人上榜，搶頭香吧</li>'; return; }
  ol.innerHTML = top.map((s,i)=>`<li class="${s.pid===S.pid?"me":""}"><span class="rk">${i+1}</span><span>${esc(mask(s.pid))}</span><span class="sc">${s.score}</span></li>`).join("");
}

/* ---------- game ---------- */
let G=null;
function startGame(){
  const pid=$("pid").value.trim();
  if(pid.length<2){ $("pidHint").textContent="請輸入遊戲 ID，排行榜和兌換都會用到"; $("pid").focus(); return; }
  if(!/^[\w\u4e00-\u9fff.\-]+$/.test(pid)){ $("pidHint").textContent="ID 只能包含英數字、中文、底線或連字號"; return; }
  $("pidHint").textContent=""; S.pid=pid;
  const deck=[...Array(8).keys()].flatMap(i=>[i,i]);
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  const backInner = S.cfg.back ? `<img src="${blob(S.cfg.back)}" alt="">` : '<div class="seal"><span>春</span></div>';
  $("grid").innerHTML = deck.map((f,k)=>`<button class="tile" data-k="${k}" data-f="${f}" aria-label="第 ${k+1} 張牌"><div class="fc back">${backInner}</div><div class="fc front">${faceHTML(f)}</div></button>`).join("");
  G={deck, open:[], pairs:0, miss:0, lock:false, start:performance.now(), limit:S.cfg.time*1000, over:false};
  $("pairs").textContent=0; $("live").textContent=0;
  show("sGame"); tick();
}
function calcScore(done,leftMs){
  return Math.max(0, G.pairs*100 + (done ? Math.round(leftMs/1000)*20 : 0) - G.miss*10);
}
function tick(){
  if(!G||G.over) return;
  const left=Math.max(0,G.limit-(performance.now()-G.start));
  $("tLeft").textContent=Math.ceil(left/1000);
  $("barFill").style.transform=`scaleX(${left/G.limit})`;
  $("bar").classList.toggle("low",left<10000);
  if(left<=0) return finish(false,0);
  requestAnimationFrame(tick);
}
$("grid").addEventListener("click",e=>{
  const t=e.target.closest(".tile"); if(!t||!G||G.over||G.lock) return;
  if(t.classList.contains("up")||t.classList.contains("done")) return;
  t.classList.add("up"); G.open.push(t);
  if(G.open.length<2) return;
  const [a,b]=G.open; G.open=[];
  if(a.dataset.f===b.dataset.f){
    a.classList.add("done"); b.classList.add("done"); G.pairs++;
    $("pairs").textContent=G.pairs; $("live").textContent=calcScore(false,0);
    if(G.pairs===8){ const left=Math.max(0,G.limit-(performance.now()-G.start)); setTimeout(()=>finish(true,left),450); }
  } else {
    G.miss++; G.lock=true; $("live").textContent=calcScore(false,0);
    const hold=Math.round((+S.cfg.missDelay||0.8)*1000);
    setTimeout(()=>{ a.classList.add("miss"); b.classList.add("miss"); },Math.min(300,hold*0.4));
    setTimeout(()=>{ a.classList.remove("up","miss"); b.classList.remove("up","miss"); G.lock=false; },hold);
  }
});

async function finish(done,leftMs){
  if(G.over) return; G.over=true;
  const score=calcScore(done,leftMs), passed=score>=S.cfg.pass;
  const rec={pid:S.pid, score, passed, pairs:G.pairs, miss:G.miss, t:Date.now(), day:today(), prized:false, redeemed:false, code:null};
  let reason="";
  if(passed && !S.demo){
    try{
      const day=today(), col=S.db.collection("scores");
      if(S.cfg.once){
        const mine=await col.where("pid","==",S.pid).where("day","==",day).where("prized","==",true).limit(1).get();
        if(!mine.empty) reason="這個 ID 今天已經兌換過了，分數仍會列入積分榜。";
      }
      if(!reason && S.cfg.cap>0){
        const n=await col.where("day","==",day).where("prized","==",true).limit(1000).get();
        if(n.size>=S.cfg.cap) reason="今日贈菜已兌換完畢，分數仍會列入積分榜。";
      }
      if(!reason){ rec.prized=true; rec.code=await claimCode(S.pid); }
    }catch(err){ reason="兌換資格確認失敗，請請服務人員協助。"; }
  } else if(passed){ rec.prized=true; rec.demo=true; rec.code="DEMO-"+Math.random().toString(36).slice(2,8).toUpperCase(); }
  let ref=null;
  if(S.db && !S.demo){ try{ ref=await S.db.collection("scores").add(rec); }catch(err){ toast("分數上傳失敗，排行榜不會更新"); } }
  renderResult(rec,ref,reason,done);
}

async function claimCode(pid){
  const snap=await S.db.collection("codes").where("used","==",false).limit(5).get();
  for(const d of snap.docs){
    const r=S.db.collection("codes").doc(d.id);
    const lease=await r.acquire({holder:S.holder, ttlMs:5000});
    if(!lease.acquired) continue;
    const cur=await r.get();
    if(cur.exists && cur.data().used===false){ await r.update({used:true, pid, usedAt:Date.now()}); return cur.data().code; }
  }
  return null;
}

let clockTimer=null;
function renderResult(rec,ref,reason,done){
  clearInterval(clockTimer);
  const head = `<p>${done?"全部配對完成！":"時間到！"}配對 ${rec.pairs} 組、翻錯 ${rec.miss} 次</p><div class="result-score">${rec.score}</div><p>分</p>`;
  let body="";
  if(rec.prized){
    body=`<div class="redeem" id="redeem">
      <p><strong>恭喜過關，請把這個畫面出示給服務人員</strong></p>
      <div class="fu" aria-hidden="true"><span>福</span></div>
      <div class="prize">${esc(S.cfg.prize)}</div>
      <div class="clock" id="clock"></div>
      <p>遊戲 ID：${esc(rec.pid)}</p>
      ${rec.code ? `<div class="code">${rec.demo?"示範序號（正式版會派發真實虛寶序號）":"明星三缺一虛寶序號"}<b id="codeTxt">${esc(rec.code)}</b><button id="copyCode">複製序號</button></div>`
                 : `<p class="note">序號已發送完畢，贈菜仍可兌換。</p>`}
      ${rec.demo ? `<p class="note">示範模式：分數不會列入積分榜</p>` : ""}
      <button class="btn hold" id="redeemBtn"><i></i>店員長按核銷</button>
    </div>`;
  } else if(rec.passed){
    body=`<div class="redeem"><p>${esc(reason)}</p></div>`;
  } else {
    body=`<p>再 <strong>${S.cfg.pass-rec.score}</strong> 分就能兌換「${esc(S.cfg.prize)}」</p>`;
  }
  $("resultCard").innerHTML = head+body+`<button class="btn ghost" id="againBtn">再玩一次</button>`;
  show("sResult");
  $("againBtn").onclick=()=>{ clearInterval(clockTimer); show("sStart"); };
  if(rec.prized){
    const upd=()=>{ const c=$("clock"); if(c) c.textContent=new Date().toLocaleTimeString("zh-TW",{hour12:false}); };
    upd(); clockTimer=setInterval(upd,1000);
    const cp=$("copyCode"); if(cp) cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(rec.code); toast("序號已複製"); }catch{ toast("請長按序號手動複製"); } };
    bindHold($("redeemBtn"), async()=>{
      if(ref){ try{ await ref.update({redeemed:true, redeemedAt:Date.now()}); }catch{ toast("核銷紀錄未存到，請記下時間"); } }
      clearInterval(clockTimer);
      const r=$("redeem"); r.classList.add("used");
      $("redeemBtn").outerHTML=`<div class="stamp">已核銷 ${new Date().toLocaleTimeString("zh-TW",{hour12:false,hour:"2-digit",minute:"2-digit"})}</div>`;
    });
  }
}
function bindHold(btn,fn){
  const bar=btn.querySelector("i"); let t0=0,raf=0;
  const step=()=>{ const p=Math.min(1,(performance.now()-t0)/1200); bar.style.transform=`scaleX(${p})`; if(p>=1){ stop(); fn(); } else raf=requestAnimationFrame(step); };
  const go=e=>{ e.preventDefault(); t0=performance.now(); raf=requestAnimationFrame(step); };
  const stop=()=>{ cancelAnimationFrame(raf); bar.style.transform="scaleX(0)"; };
  btn.addEventListener("pointerdown",go); ["pointerup","pointerleave","pointercancel"].forEach(ev=>btn.addEventListener(ev,stop));
  btn.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" ") { e.preventDefault(); fn(); } });
}
$("startBtn").onclick=startGame;
$("pid").addEventListener("keydown",e=>{ if(e.key==="Enter") startGame(); });

/* ---------- admin ---------- */
function fillAdmin(){
  const c=S.cfg;
  $("cMiss").value=c.missDelay;
  $("cTime").value=c.time; $("cPass").value=c.pass; $("cPrize").value=c.prize; $("cCap").value=c.cap; $("cOnce").checked=!!c.once;
  $("faceSlots").innerHTML = c.faces.map((id,i)=>`<label class="slot">${id?`<img src="${blob(id)}" alt="">`:`牌面 ${i+1}<br>上傳`}<input type="file" accept="image/*" data-face="${i}"></label>`).join("");
  const bs=[["back","牌背"],["bg","背景主視覺"],["logoA","築間 Logo"],["logoB","明星三缺一 Logo"]];
  $("brandSlots").innerHTML = bs.map(([k,n])=>`<label class="slot">${c[k]?`<img src="${blob(c[k])}" alt="">`:`${n}<br>上傳`}<input type="file" accept="image/*" data-key="${k}"></label>`).join("");
}
async function saveCfg(patch){
  Object.assign(S.cfg,patch);
  try{ await S.db.doc("cfg/main").set({...S.cfg}); toast("已儲存"); }catch(err){ toast("儲存失敗："+(err.code||"")); }
}
$("saveCfg").onclick=()=>saveCfg({
  time:Math.min(180,Math.max(20,+$("cTime").value||60)), pass:Math.max(0,+$("cPass").value||0),
  prize:$("cPrize").value.trim()||DEFAULT_CFG.prize, cap:Math.max(0,+$("cCap").value||0), once:$("cOnce").checked,
  missDelay:Math.min(2,Math.max(0.3,+$("cMiss").value||0.8))
});
document.addEventListener("change",async e=>{
  const inp=e.target; if(!(inp instanceof HTMLInputElement)||inp.type!=="file"||!inp.files[0]) return;
  if(!S.assets){ toast("這個檢視無法上傳素材"); return; }
  toast("上傳中…");
  try{
    const r=await S.assets.upload(inp.files[0]);
    if(inp.dataset.face!==undefined){ const f=[...S.cfg.faces]; f[+inp.dataset.face]=r.id; await saveCfg({faces:f}); }
    else await saveCfg({[inp.dataset.key]:r.id});
  }catch(err){ toast("上傳失敗，請換一張 20MB 以內的圖片"); }
});
$("resetFaces").onclick=()=>saveCfg({faces:[...DEFAULT_CFG.faces]});
$("addCodes").onclick=async()=>{
  const lines=[...new Set($("codesIn").value.split(/[\r\n,\t]+/).map(s=>s.trim()).filter(Boolean))];
  if(!lines.length){ toast("請先貼上序號"); return; }
  const btn=$("addCodes"); btn.disabled=true;
  let ok=0; const base=Date.now().toString(36);
  for(let i=0;i<lines.length;i+=5){
    await Promise.all(lines.slice(i,i+5).map((code,j)=>S.db.collection("codes").doc("c"+base+"-"+(i+j)).set({code,used:false,addedAt:Date.now()}).then(()=>ok++).catch(()=>{})));
  }
  btn.disabled=false; $("codesIn").value=""; toast(`已加入 ${ok} 組序號`); refreshCodes();
};
$("clearPlays").onclick=async()=>{
  if(!confirm("確定清除所有遊玩紀錄？排行榜會一起清空，序號不受影響。")) return;
  const snap=await S.db.collection("scores").limit(1000).get();
  for(const d of snap.docs){ try{ await S.db.collection("scores").doc(d.id).delete(); }catch{} }
  toast("已清除");
};
async function refreshCodes(){
  try{ const s=await S.db.collection("codes").where("used","==",false).limit(1000).get(); $("stCodes").textContent=s.size; }catch{}
}
function renderStats(){
  const all=S.scores; $("stPlays").textContent=all.length;
  if(!all.length){ $("stRate").textContent="–"; return; }
  const pass=all.filter(s=>s.passed).length; $("stRate").textContent=Math.round(pass/all.length*100)+"%";
  if(all.length>=20){
    const sorted=all.map(s=>s.score).sort((a,b)=>a-b);
    const p70=sorted[Math.floor(sorted.length*0.7)];
    $("stSuggest").textContent=`依目前 ${all.length} 局的分數，門檻設在 ${Math.round(p70/10)*10} 分左右，約 30% 的人能過關。`;
  } else $("stSuggest").textContent=`目前 ${all.length} 局，累積 20 局以上會算出建議門檻。`;
}

/* ---------- boot (demo) ---------- */
renderChrome();
$("board").innerHTML='<li class="empty">示範版：正式上線後會記錄積分榜</li>';
</script>
